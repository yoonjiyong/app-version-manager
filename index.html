<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>App Version Manager</title>
  <link href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;600;700&family=Noto+Sans+KR:wght@400;500;700&display=swap" rel="stylesheet">
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #12121a;
      --surface-hover: #1a1a26;
      --border: #1e1e2e;
      --text: #e4e4ef;
      --text-dim: #6b6b80;
      --accent: #6ee7b7;
      --accent-dim: rgba(110, 231, 183, 0.1);
      --danger: #f87171;
      --danger-dim: rgba(248, 113, 113, 0.1);
      --warn: #fbbf24;
      --warn-dim: rgba(251, 191, 36, 0.1);
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Noto Sans KR', sans-serif;
      min-height: 100vh;
      padding: 0;
    }

    .noise {
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 256 256' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noise'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noise)' opacity='0.03'/%3E%3C/svg%3E");
      pointer-events: none;
      z-index: 0;
    }

    .container {
      position: relative;
      z-index: 1;
      max-width: 960px;
      margin: 0 auto;
      padding: 60px 24px;
    }

    header {
      margin-bottom: 56px;
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 12px;
    }

    .logo-icon {
      width: 40px;
      height: 40px;
      background: linear-gradient(135deg, var(--accent), #34d399);
      border-radius: 10px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
      color: #0a0a0f;
      font-weight: 700;
      font-family: 'JetBrains Mono', monospace;
    }

    h1 {
      font-family: 'JetBrains Mono', monospace;
      font-size: 28px;
      font-weight: 700;
      letter-spacing: -0.5px;
    }

    .subtitle {
      color: var(--text-dim);
      font-size: 14px;
      margin-top: 4px;
    }

    .endpoint {
      margin-top: 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
    }

    .endpoint-label {
      color: var(--accent);
      font-weight: 600;
      white-space: nowrap;
    }

    .endpoint-url {
      color: var(--text-dim);
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
      flex: 1;
    }

    .copy-btn {
      background: var(--accent-dim);
      border: 1px solid rgba(110, 231, 183, 0.2);
      color: var(--accent);
      padding: 6px 14px;
      border-radius: 6px;
      cursor: pointer;
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      font-weight: 600;
      transition: all 0.2s;
      white-space: nowrap;
    }

    .copy-btn:hover {
      background: rgba(110, 231, 183, 0.2);
    }

    .stats {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 16px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
    }

    .stat-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 32px;
      font-weight: 700;
    }

    .stat-label {
      color: var(--text-dim);
      font-size: 13px;
      margin-top: 4px;
    }

    .stat-value.accent { color: var(--accent); }
    .stat-value.danger { color: var(--danger); }
    .stat-value.warn { color: var(--warn); }

    .section-title {
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      font-weight: 600;
      margin-bottom: 20px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .section-title::before {
      content: '';
      width: 3px;
      height: 18px;
      background: var(--accent);
      border-radius: 2px;
    }

    .app-grid {
      display: grid;
      gap: 16px;
    }

    .app-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 24px;
      transition: all 0.3s ease;
    }

    .app-card:hover {
      border-color: rgba(110, 231, 183, 0.2);
      background: var(--surface-hover);
    }

    .app-header {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
      margin-bottom: 20px;
    }

    .app-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 700;
    }

    .app-id {
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
      font-size: 12px;
      margin-top: 2px;
    }

    .badge {
      padding: 5px 12px;
      border-radius: 20px;
      font-size: 12px;
      font-weight: 600;
      font-family: 'JetBrains Mono', monospace;
    }

    .badge-force {
      background: var(--danger-dim);
      color: var(--danger);
      border: 1px solid rgba(248, 113, 113, 0.2);
    }

    .badge-optional {
      background: var(--warn-dim);
      color: var(--warn);
      border: 1px solid rgba(251, 191, 36, 0.2);
    }

    .version-row {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .version-item {
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 8px;
      padding: 12px;
    }

    .version-label {
      color: var(--text-dim);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      margin-bottom: 6px;
    }

    .version-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 18px;
      font-weight: 600;
    }

    .version-value.latest { color: var(--accent); }

    .platform-block {
      margin-top: 16px;
      padding: 16px;
      background: rgba(255, 255, 255, 0.02);
      border: 1px solid var(--border);
      border-radius: 10px;
    }

    .platform-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    .platform-name {
      font-family: 'JetBrains Mono', monospace;
      font-size: 13px;
      font-weight: 700;
      color: var(--text);
      letter-spacing: 0.5px;
    }

    .platform-name .icon {
      margin-right: 6px;
    }

    .store-link {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      color: var(--text-dim);
      font-size: 12px;
      text-decoration: none;
      margin-top: 16px;
      font-family: 'JetBrains Mono', monospace;
      transition: color 0.2s;
    }

    .store-link:hover { color: var(--accent); }

    .loading {
      text-align: center;
      padding: 80px 0;
      color: var(--text-dim);
      font-family: 'JetBrains Mono', monospace;
    }

    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin: 0 auto 16px;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    .error {
      text-align: center;
      padding: 60px 0;
      color: var(--danger);
      font-family: 'JetBrains Mono', monospace;
    }

    .last-updated {
      text-align: center;
      color: var(--text-dim);
      font-size: 12px;
      margin-top: 48px;
      font-family: 'JetBrains Mono', monospace;
    }

    @media (max-width: 640px) {
      .container { padding: 32px 16px; }
      .stats { grid-template-columns: repeat(3, 1fr); gap: 8px; }
      .stat-card { padding: 14px; }
      .stat-value { font-size: 24px; }
      .version-row { grid-template-columns: 1fr; }
      .endpoint { flex-wrap: wrap; }
      .endpoint-url { width: 100%; }
      h1 { font-size: 22px; }
    }
  </style>
</head>
<body>
  <div class="noise"></div>
  <div class="container">
    <header>
      <div class="logo">
        <div class="logo-icon">V</div>
        <div>
          <h1>App Version Manager</h1>
          <div class="subtitle">앱 버전 관리 대시보드</div>
        </div>
      </div>
      <div class="endpoint">
        <span class="endpoint-label">GET</span>
        <span class="endpoint-url" id="endpointUrl">loading...</span>
        <button class="copy-btn" onclick="copyEndpoint()">Copy</button>
      </div>
    </header>

    <div class="stats" id="stats">
      <div class="stat-card">
        <div class="stat-value accent" id="totalApps">-</div>
        <div class="stat-label">Total Apps</div>
      </div>
      <div class="stat-card">
        <div class="stat-value danger" id="forceCount">-</div>
        <div class="stat-label">Force Update</div>
      </div>
      <div class="stat-card">
        <div class="stat-value warn" id="optionalCount">-</div>
        <div class="stat-label">Optional</div>
      </div>
    </div>

    <div class="section-title">Registered Apps</div>

    <div class="app-grid" id="appGrid">
      <div class="loading">
        <div class="spinner"></div>
        Loading version data...
      </div>
    </div>

    <div class="last-updated" id="lastUpdated"></div>
  </div>

  <script>
    const VERSION_FILE = 'version.json';

    async function loadVersions() {
      try {
        const res = await fetch(VERSION_FILE + '?t=' + Date.now());
        if (!res.ok) throw new Error('Failed to fetch');
        const data = await res.json();
        renderDashboard(data);
      } catch (e) {
        document.getElementById('appGrid').innerHTML =
          '<div class="error">⚠ version.json을 불러올 수 없습니다</div>';
      }
    }

    function platformBlock(label, icon, storeName, p) {
      if (!p) return '';
      const isForce = p.min_version === p.latest_version;
      return `
        <div class="platform-block">
          <div class="platform-header">
            <div class="platform-name"><span class="icon">${icon}</span>${label}</div>
            <span class="badge ${isForce ? 'badge-force' : 'badge-optional'}">
              ${isForce ? 'FORCE' : 'OPTIONAL'}
            </span>
          </div>
          <div class="version-row">
            <div class="version-item">
              <div class="version-label">Min</div>
              <div class="version-value">${p.min_version ?? '-'}</div>
            </div>
            <div class="version-item">
              <div class="version-label">Latest</div>
              <div class="version-value latest">${p.latest_version ?? '-'}</div>
            </div>
          </div>
          ${p.store_url ? `<a href="${p.store_url}" target="_blank" rel="noopener noreferrer" class="store-link">→ ${storeName}</a>` : ''}
        </div>
      `;
    }

    function renderDashboard(data) {
      const apps = Object.entries(data);
      let forceCount = 0;
      let optionalCount = 0;
      apps.forEach(([, app]) => {
        ['android', 'ios'].forEach(k => {
          const p = app[k];
          if (!p) return;
          if (p.min_version === p.latest_version) forceCount++;
          else optionalCount++;
        });
      });

      document.getElementById('totalApps').textContent = apps.length;
      document.getElementById('forceCount').textContent = forceCount;
      document.getElementById('optionalCount').textContent = optionalCount;

      const baseUrl = window.location.href.replace(/\/[^/]*$/, '');
      document.getElementById('endpointUrl').textContent = baseUrl + '/version.json';

      const grid = document.getElementById('appGrid');
      grid.innerHTML = apps.map(([key, app]) => `
        <div class="app-card">
          <div class="app-header">
            <div>
              <div class="app-name">${app.name || key}</div>
              <div class="app-id">${key}</div>
            </div>
          </div>
          ${platformBlock('Android', '🤖', 'Play Store', app.android)}
          ${platformBlock('iOS', '🍎', 'App Store', app.ios)}
        </div>
      `).join('');

      document.getElementById('lastUpdated').textContent =
        'Last checked: ' + new Date().toLocaleString('ko-KR');
    }

    function copyEndpoint() {
      const url = document.getElementById('endpointUrl').textContent;
      navigator.clipboard.writeText(url).then(() => {
        const btn = document.querySelector('.copy-btn');
        btn.textContent = 'Copied!';
        setTimeout(() => btn.textContent = 'Copy', 2000);
      });
    }

    loadVersions();
  </script>
</body>
</html>
